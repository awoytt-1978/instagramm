name: Entwurf freigeben oder ablehnen

on:
  workflow_dispatch:
    inputs:
      ordner:
        description: "Entwurfsordner, z. B. 2026-W43/01-post-abendsnacks"
        required: true
      aktion:
        description: "freigeben oder ablehnen"
        type: choice
        options: [freigeben, ablehnen]
        default: freigeben
      zeit:
        description: "Veröffentlichung (Berlin), z. B. 2026-10-22T18:00 (nur bei freigeben)"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-drafts
  cancel-in-progress: false

jobs:
  freigabe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Status setzen
        env:
          ORDNER: ${{ inputs.ordner }}
          AKTION: ${{ inputs.aktion }}
          ZEIT: ${{ inputs.zeit }}
        run: |
          if [ "$AKTION" = "ablehnen" ]; then
            python approve.py "$ORDNER" --reject
          else
            [ -n "$ZEIT" ] || { echo "Bitte eine Zeit angeben"; exit 1; }
            python approve.py "$ORDNER" "$ZEIT"
          fi
      - name: Speichern
        run: |
          git config user.name "andwoy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add drafts
          git commit -m "Freigabe-Status geändert"
          git push
